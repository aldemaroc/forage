services:
  forage:
    build: .
    # Published image: docker pull ghcr.io/aldemaroc/forage:latest
    # `build: .` above keeps local builds working; compose tags the local build
    # with this name. To run the published image without building, comment out
    # the build line and use `docker compose pull && docker compose up -d`.
    # `latest` follows the newest release: `docker compose pull` upgrades. Pin
    # the exact version (`:1.2.0`) instead when you want updates to be a
    # deliberate step.
    image: ghcr.io/aldemaroc/forage:latest
    container_name: forage
    restart: always
    # PID 1 = docker-init (tini), not the python app: every /search launches a
    # one-shot Chromium whose helper processes (2x chrome_crashpad_handler,
    # 2x zygote) get orphaned and re-parented to PID 1. Without an init that
    # calls wait(), they pile up as zombies and each one keeps holding a PID
    # slot in the container cgroup until the task ceiling (systemd's
    # DefaultTasksMax) is hit and Chromium can no longer spawn threads.
    init: true
    ports:
      - "127.0.0.1:3672:3672"   # host-only bind: nothing external reaches it
    volumes:
      - ./config.yaml:/etc/forage/config.yaml:ro   # bind mount, read-only
    # Everything that records what happened lives in RAM on purpose. The request
    # log (GET /admin/requests) and the app log are written under this tmpfs,
    # which comes back empty on every container start: restart the container and
    # no log, record or counter survives, on disk or in the image layer.
    tmpfs:
      - /var/lib/forage:size=16m,mode=0755
    env_file: .env
    # Container stdout is kept on the host, but capped: `local` is Docker's
    # rotating driver and max-size/max-file put a hard ceiling on it (10 MB,
    # a single file). Plain json-file would accumulate without limit.
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "1"
        # The local driver compresses by default, and compression refuses to
        # run with a single file: without this the container does not start.
        compress: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3672/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# No extra network here on purpose. The default `search.provider` is `forage`,
# which renders the SERPs in the container's own browser, so this stack runs
# alone on its own compose network and needs nothing else.
#
# SearXNG is opt-in (`search.provider: searxng`). Forage then has to reach that
# container, which means joining the SearXNG network: see "Using SearXNG" in
# docs/SEARXNG.md for the two-line docker-compose.override.yml that does it.
