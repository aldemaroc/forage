name: web-forage
version: 0.1.0
description: "Forage web search & extract (self-hosted). Requires FORAGE_URL pointing at your instance."
author: Aldemaro Campos
kind: backend
requires_hermes: ">=0.22.3"
provides_web_providers:
  - forage
provides_tools:
  - forage_full_extract
optional_env:
  - name: FORAGE_URL
    description: "Base URL of your Forage instance (default http://localhost:3672)"
    password: false
  - name: FORAGE_API_KEY
    description: "Bearer key, only when the Forage instance has auth.enabled"
    password: true
  - name: FORAGE_BYPASS_CACHE
    description: "1/true to always bypass the instance cache"
    password: false
  - name: FORAGE_SEARCH_TIMEOUT
    description: "Seconds to wait for a search (default 90: a challenged SERP plus a fallback engine can take that long)"
    password: false
  - name: FORAGE_EXTRACT_TIMEOUT
    description: "Seconds to wait for an extract (default 60)"
    password: false
